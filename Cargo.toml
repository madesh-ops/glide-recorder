[workspace]
resolver = "2"
members = ["crates/studio-core", "crates/studio-engine", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rayon = "1.12"
png = "0.18"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
studio-core = { path = "crates/studio-core" }
studio-engine = { path = "crates/studio-engine" }

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.studio-core]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
